# Global Vale config, linked to ~/.vale.ini. Styles live next to it.
# After cloning: `vale sync` fetches the ai-tells package into styles/.
#
#   vale streaming_api.typ        lint one file
#   vale --minAlertLevel error x  only the strong signals
StylesPath = /Users/ishovkun/dotfiles/vale/styles
MinAlertLevel = suggestion
Packages = ai-tells

# Typst has no Vale parser (it wants typst2vast); its prose reads fine as
# Markdown, so lint it as Markdown.
[formats]
typ = md

[*.{md,txt,typ,rst}]
BasedOnStyles = ai-tells, Igor

# Systems prose uses these words literally; the rules' own docs say to turn
# them off for process-lifecycle / concurrency / "implementation" text.
ai-tells.MortalityMetaphors = NO
ai-tells.BareHolds = NO
ai-tells.FigurativeHolds = NO
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeStays = NO
ai-tells.FormalRegister = NO
